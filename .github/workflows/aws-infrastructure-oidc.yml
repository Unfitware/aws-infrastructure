name: Run AWS Login with OIDC and Deploy

# Trigger - 7
on: [push] 

permissions:
  id-token: write
  contents: read
  
jobs:
  AWS-login-and-test:
    runs-on: ubuntu-latest

    # Sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
      # Checks-out the repository under $GITHUB_WORKSPACE, so your job can access it
        uses: actions/checkout@v4
          
      # Get AWS Role With WebIdentity              
      - name: '"Configure AWS Credentials" Action for GitHub Actions on runner'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: 'us-west-2' 
          role-to-assume: arn:aws:iam::677252573665:role/GitHubActions
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      # Verify ID
      - name: Verify caller identity
        run: aws sts get-caller-identity

      # Check Tokens
      - name: Read OIDC Token
        run: echo $ACTIONS_ID_TOKEN_REQUEST_URL
      - name: Read OIDC Token
        run: echo $ACTIONS_ID_TOKEN_REQUEST_TOKEN

      # List buckets
      - name: Run some test aws cli commands
        run: aws s3 ls

      # Install Javascript Query on Runner

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Create the folders to store stuff

      - name: Prepare output folders
        run: |
          mkdir -p output/tagging
          mkdir -p output/reports

      # Get the regions with AWS CLI commands    
      - name: Get all AWS regions
        run: |
          aws ec2 describe-regions \
            --query 'Regions[].RegionName' \
            --output text | tr '\t' '\n' > output/reports/regions.txt

      # Run AWS CLI to get resources and output results to files
      - name: Collect inventory with Tagging API
        shell: bash
        run: |
          while read -r region; do
            echo "Scanning $region"
            aws resourcegroupstaggingapi get-resources \
              --region "$region" \
              --output json > "output/tagging/${region}.json" || \
            echo '{"ResourceTagMappingList":[]}' > "output/tagging/${region}.json"
          done < output/reports/regions.txt


       # Run AWS CLI to create CSV files 
      - name: Build CSV report
        shell: bash
        run: |
          echo "region,arn,service,tag_count" > output/reports/inventory.csv

          while read -r region; do
            jq -r --arg region "$region" '
              (.ResourceTagMappingList // [])[] |
              [
                $region,
                (.ResourceARN // ""),
                ((.ResourceARN // "") | split(":")[2] // ""),
                ((.Tags // []) | length)
              ] | @csv
            ' "output/tagging/${region}.json" >> output/reports/inventory.csv
          done < output/reports/regions.txt

      - name: Upload to S3
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          aws s3 cp output/reports/inventory.csv \
            s3://$platform-meta-store/$labels-tags/inventory-${TIMESTAMP}.csv
          

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-inventory
          path: output/reports/
          retention-days: 14
   

           
          

  
