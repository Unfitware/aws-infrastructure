#
# Workflow to bootstrap AWS for GitHub Actions Terraform automation using OIDC.
# This pipeline setups all the necessary AWS resources and permissions to allow GitHub Actions to interact with AWS securely using OIDC, without the need for long-lived credentials.
#
# NOTE: This workflow requires long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# secrets (an IAM user). If you bootstrap from an IAM Identity Center (SSO) admin
# instead, run terraform/bootstrap/bootstrap-oidc.sh locally under that SSO profile
# — Identity Center issues only temporary credentials that can't live in GH secrets.
#

name: Bootstrap AWS for GitHub Actions and Terraform

on:
  workflow_dispatch:
    inputs:
      permission_level:
        description: 'Permissions to attach to the GitHubActions role'
        type: choice
        default: 'scoped'
        options:
          - scoped   # least-privilege terraform-admin-policy.json (recommended)
          - admin    # AWS-managed AdministratorAccess (sandbox only)

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'us-west-2'

jobs:
  Bootstrap-AWS-for-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4  

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-west-2


      - name: Run AWS CLI Commands to bootstrap for GitHub Actions Terraform automation
        env:
          ACCOUNT_ID: '677252573665'
          # Role name must match the role assumed by the OIDC workflows (e.g. aws-terraform-plan.yml).
          ROLE_NAME: 'GitHubActions'
          # OIDC sub claim is case-sensitive: must match the real GitHub org/repo casing.
          GH_REPO: 'Unfitware/aws-infrastructure'
          PERMISSION_LEVEL: ${{ inputs.permission_level }}
          SCOPED_POLICY_NAME: 'GitHubActions-TerraformAdmin'
          SCOPED_POLICY_FILE: '.github/workflows/bootstrap/terraform-admin-policy.json'
        run: |
          set -euo pipefail

          # Create identity provider for GitHub Actions OIDC (idempotent: ignore if it already exists)
          aws iam create-open-id-connect-provider \
            --url https://token.actions.githubusercontent.com \
            --client-id-list sts.amazonaws.com \
            || echo "OIDC provider already exists, continuing."

          # Create IAM Role for GitHub Actions with OIDC trust policy
          aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [
              {
                \"Effect\": \"Allow\",
                \"Principal\": {
                  \"Federated\": \"arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com\"
                },
                \"Action\": \"sts:AssumeRoleWithWebIdentity\",
                \"Condition\": {
                  \"StringEquals\": {
                    \"token.actions.githubusercontent.com:aud\": \"sts.amazonaws.com\"
                  },
                  \"StringLike\": {
                    \"token.actions.githubusercontent.com:sub\": \"repo:${GH_REPO}:*\"
                  }
                }
              }
            ]
          }"

          # Attach permissions to the role based on the chosen permission_level input.
          # The toggle is authoritative: each branch detaches the other policy so the role
          # ends up with exactly the chosen permission set (detach is a no-op if not attached).
          ADMIN_POLICY_ARN="arn:aws:iam::aws:policy/AdministratorAccess"
          SCOPED_POLICY_ARN="arn:aws:iam::${ACCOUNT_ID}:policy/${SCOPED_POLICY_NAME}"

          if [ "$PERMISSION_LEVEL" = "admin" ]; then
            echo "Attaching AWS-managed AdministratorAccess (sandbox only)."
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$ADMIN_POLICY_ARN"
            echo "Detaching scoped policy if present."
            aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$SCOPED_POLICY_ARN" \
              || echo "Scoped policy was not attached, nothing to detach."
          else
            echo "Attaching least-privilege customer-managed policy: $SCOPED_POLICY_NAME"
            # Create the policy if it does not already exist (idempotent across reruns).
            if ! aws iam get-policy --policy-arn "$SCOPED_POLICY_ARN" >/dev/null 2>&1; then
              aws iam create-policy --policy-name "$SCOPED_POLICY_NAME" \
                --policy-document "file://${SCOPED_POLICY_FILE}"
            else
              echo "Policy already exists, reusing $SCOPED_POLICY_ARN"
            fi
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$SCOPED_POLICY_ARN"
            echo "Detaching AdministratorAccess if present."
            aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$ADMIN_POLICY_ARN" \
              || echo "AdministratorAccess was not attached, nothing to detach."
          fi
















