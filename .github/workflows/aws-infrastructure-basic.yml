name: Run AWS Login with keys

# Trigger - 4
'on':
  - push

permissions:
  id-token: write
  contents: read

jobs:
  AWS-login-and-test:
    runs-on: ubuntu-latest

    # Sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        # Checks-out the repository under $GITHUB_WORKSPACE, so your job can access it
        uses: actions/checkout@v4

      # Login with AWS Access Key and Secret Key
      - name: Configure AWS Credentials using Access Key and Secret Key
        uses: aws-actions/configure-aws-credentials@v4.1.0
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-west-2

      # List S3 Buckets
      - name: List S3 Buckets
        run: aws s3 ls

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
      
      # Terraform Init
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      # Terraform Plan
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform
 
